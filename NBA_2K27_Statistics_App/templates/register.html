<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create User - Basketball Stats App</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    .container { max-width: 420px; margin: auto; }
    input { width: 100%; padding: 8px; margin: 6px 0 12px; box-sizing: border-box; }
    label { font-weight: bold; display: block; margin-top: 12px; }
    button { padding: 10px 16px; background: #007bff; border: none; color: white; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
    .flash { padding: 12px; border-radius: 4px; margin-bottom: 16px; }
    .flash.error { background: #f8d7da; color: #842029; }
    .flash.success { background: #d1e7dd; color: #0f5132; }
    nav a { margin-right: 16px; text-decoration: none; color: #007bff; }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <a href="{{ url_for('home.home') }}">Home</a>
      <a href="{{ url_for('auth.login') }}">Log In</a>
    </nav>

    <h1>Create User</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category if category != 'message' else '' }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>

      <label for="confirm_password">Confirm Password</label>
      <input id="confirm_password" name="confirm_password" type="password" required>

      <button type="submit">Create User</button>
    </form>
  </div>
</body>
</html>
