<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basketball Stats App</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    .container { max-width: 600px; margin: auto; text-align: center; }
    a.button { display: inline-block; margin: 12px 8px; padding: 12px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; }
    a.button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to the Basketball Stats App</h1>
    <p>Log in or create a user to begin tracking basketball game stats.</p>
    <a class="button" href="{{ url_for('auth.login') }}">Log In</a>
    <a class="button" href="{{ url_for('auth.register') }}">Create User</a>
  </div>
</body>
</html>
