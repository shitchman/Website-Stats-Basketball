{% extends 'dashboard_base.html' %}

{% block content %}
  <div class="card">
    <h2>Friends</h2>
    <form method="post" style="margin-bottom: 24px;">
      <div class="form-row">
        <input type="text" name="friend_name" placeholder="Friend Name" required>
        <input type="text" name="friend_handle" placeholder="Friend Handle">
      </div>
      <button type="submit">Add Friend</button>
    </form>
    {% if friends %}
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Handle</th>
          </tr>
        </thead>
        <tbody>
          {% for friend in friends %}
            <tr>
              <td>{{ friend['friend_name'] }}</td>
              <td>{{ friend['friend_handle'] or '-' }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p>You don't have any friends added yet.</p>
    {% endif %}
  </div>
{% endblock %}
