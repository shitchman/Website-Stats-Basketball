<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basketball Stats Entry</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    .container { max-width: 700px; margin: auto; }
    input, select { width: 100%; padding: 8px; margin: 6px 0 12px; box-sizing: border-box; }
    label { font-weight: bold; display: block; margin-top: 12px; }
    button { padding: 10px 16px; background: #007bff; border: none; color: white; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
    .flash { padding: 12px; border-radius: 4px; margin-bottom: 16px; }
    .flash.error { background: #f8d7da; color: #842029; }
    .flash.success { background: #d1e7dd; color: #0f5132; }
    nav a { margin-right: 16px; text-decoration: none; color: #007bff; }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <a href="{{ url_for('index') }}">Enter Stats</a>
      <a href="{{ url_for('list_stats') }}">View Saved Stats</a>
    </nav>

    <h1>Enter Basketball Stats</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category if category != 'message' else '' }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post">
      <label for="player_name">Player Name</label>
      <input id="player_name" name="player_name" type="text" required>

      <label for="game_date">Game Date</label>
      <input id="game_date" name="game_date" type="date" required>

      <label for="position">Position</label>
      <select id="position" name="position" required>
        <option value="">Select position</option>
        <option value="PG">PG</option>
        <option value="SG">SG</option>
        <option value="SF">SF</option>
        <option value="PF">PF</option>
        <option value="C">C</option>
      </select>

      <label for="points">Points</label>
      <input id="points" name="points" type="number" min="0" value="0">

      <label for="rebounds">Rebounds</label>
      <input id="rebounds" name="rebounds" type="number" min="0" value="0">

      <label for="assists">Assists</label>
      <input id="assists" name="assists" type="number" min="0" value="0">

      <label for="steals">Steals</label>
      <input id="steals" name="steals" type="number" min="0" value="0">

      <label for="blocks">Blocks</label>
      <input id="blocks" name="blocks" type="number" min="0" value="0">

      <label for="turnovers">Turnovers</label>
      <input id="turnovers" name="turnovers" type="number" min="0" value="0">

      <label for="fouls">Fouls</label>
      <input id="fouls" name="fouls" type="number" min="0" value="0">

      <button type="submit">Save Stats</button>
    </form>
  </div>
</body>
</html>
