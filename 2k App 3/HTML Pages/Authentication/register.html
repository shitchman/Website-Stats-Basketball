<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Register - Hoop Stats{% endblock %}</title>

    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">

</head>

<body>
    <h1>Register for Hoops Stats</h1>
    <form id="registerForm" method="POST">
        <div>
            <label for="title">Gender:</label>

            <label for="Male">Male</label>
            <input type="radio" id="Male" name="gender" value="male">

            <label for="Female">Female</label>
            <input type="radio" id="Female" name="gender" value="female">

            <label for="Other">Other</label>
            <input type="radio" id="Other" name="gender" value="other">
        </div>

        <div>
            <label for="username" class="form-label">Username:</label>
            <input type="text" class="form-control" id="username" placeholder="Username" required>
        </div>

        <div>
            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control" id="email" placeholder="email@gmail.com" required>
        </div>

        <div>
            <label for="password" class="form-label">Password:</label>
            <input type="password" class="form-control" id="password" placeholder="Password" maxLength="12" required>
        </div>

        <div>
            <label for="confirm_password" class="form-label">Confirm Password:</label>
            <input type="password" class="form-control" id="confirm_password" placeholder="Password" maxLength="12" required>
        </div>

        <button type="submit" class="btn btn-primary">Register</button>

    </form>
</body>

</html>
